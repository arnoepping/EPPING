<title>Epping Rooftop Entrance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="shared.css">
<script src="wordmark.js"></script>
<script src="posters.js"></script>
<script src="shared.js"></script>
<script>
// Rooftop entrance (from concept 1, The Door): brick wall, rope and neon sign outside; through the door a
// stairwell takes you up; at the top the door opens onto a rooftop party at dusk, then the footage takes over.
const { clamp, lerp, ease, rgba, mix, drawLogo, rand } = Entrance.util;
const R = rand(7), BRICKS = Array.from({ length: 400 }, () => R());
const SKY = Array.from({ length: 40 }, () => ({ w: 0.6 + R() * 1.2, h: 0.5 + R() * 1.1, gable: R() > 0.4, chim: R() > 0.6, lit: Array.from({ length: 6 }, () => R() > 0.6) }));
const SMOKE = Array.from({ length: 14 }, () => ({ x: R(), ph: R() * 10, s: 0.6 + R() * 0.8 }));

// ---------- 1 · outside: the door ----------
function wall(ctx, S, scale) {
  const { w, h, pal } = S, bw = 64 * scale, bh = 26 * scale;
  ctx.fillStyle = mix(pal.bg, pal.a, 0.05); ctx.fillRect(0, 0, w, h);
  let i = 0;
  for (let y = h / 2 - Math.ceil(h / 2 / bh) * bh; y < h; y += bh) {
    const row = Math.round((y - h / 2) / bh), off = row % 2 ? bw / 2 : 0;
    for (let x = w / 2 - Math.ceil(w / 2 / bw + 1) * bw + off; x < w; x += bw) {
      ctx.fillStyle = mix(pal.bg, pal.fg, 0.03 + BRICKS[i++ % BRICKS.length] * 0.05);
      ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
    }
  }
}

function outside(ctx, S) {
  const { w, h, pal, local, kick, t } = S, cx = w / 2, cy = h / 2, pulse = 0.55 + 0.45 * kick;
  const z = lerp(0.42, 1.05, ease(local)), dh = h * 0.62 * z, dw = dh * 0.5;
  wall(ctx, S, z * 1.1); // the wall grows with the door: you walk up to it
  const dx = cx - dw / 2, dy = cy - dh * 0.42, sy = dy - dh * 0.16;
  // the sign's glow on the brick, then a plain black door on top, then a soft spill from under it
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(cx, sy, 0, cx, sy, dw * 1.8);
  glow.addColorStop(0, rgba(pal.b, 0.3 * pulse)); glow.addColorStop(0.5, rgba(pal.a, 0.1 * pulse)); glow.addColorStop(1, rgba(pal.a, 0));
  ctx.fillStyle = glow; ctx.fillRect(cx - dw * 1.8, sy - dw * 1.8, dw * 3.6, dw * 3.6);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = mix(pal.bg, '#000000', 0.55); ctx.fillRect(dx, dy, dw, dh);
  ctx.globalCompositeOperation = 'lighter';
  const leak = ctx.createRadialGradient(cx, dy + dh, 0, cx, dy + dh, dw * 1.1);
  leak.addColorStop(0, rgba(pal.b, 0.28 * pulse)); leak.addColorStop(1, rgba(pal.b, 0));
  ctx.fillStyle = leak; ctx.fillRect(cx - dw * 1.1, dy + dh, dw * 2.2, dw * 1.1); // only below the door, so the door stays black
  ctx.globalCompositeOperation = 'source-over';
  drawLogo(ctx, pal, cx, sy, dw * 1.5, { glow: 30 * z, alpha: Math.sin(t * 13) > 0.92 ? 0.35 : 1, split: 2 });
  S.hit(dx, dy, dw, dh, 0.36); // click the door: in you go
  ctx.strokeStyle = pal.a; ctx.lineWidth = 5 * z; ctx.beginPath();
  ctx.moveTo(dx - dw * 0.9, dy + dh * 0.82); ctx.quadraticCurveTo(dx - dw * 0.45, dy + dh * 0.95, dx - dw * 0.05, dy + dh * 0.82); ctx.stroke();
  ctx.fillStyle = mix(pal.fg, pal.a, 0.4);
  for (const px of [dx - dw * 0.9, dx - dw * 0.05]) ctx.fillRect(px - 3 * z, dy + dh * 0.78, 6 * z, dh * 0.22);
}

// ---------- 2 · up the stairs ----------
// Steep flight (about 43°) so it feels like climbing to a roof, not one floor.
const N = 36, RISE = 0.24, DEPTH = 0.26, HW = 0.75, SLOPE = RISE / DEPTH, PITCH = 0.58, CEIL = 3.2;
// Posters: listed in posters.js (images in posters/). {pal} in a path becomes sunset / gold.
const IMG = {};
function posterImg(src) { if (!IMG[src]) { IMG[src] = new Image(); IMG[src].src = src; } return IMG[src]; }
const SLOTS = [[-1, 1.4], [1, 2.7], [-1, 4.0], [1, 5.3], [-1, 6.6], [1, 7.9]]; // [wall side, z]

function stairs(ctx, S) {
  const { w, h, pal, local, kick, palKey } = S, cx = w / 2, cy = h * 0.5, F = Math.min(w, h) * 0.9;
  const climb = ease(clamp((local - 0.1) / 0.78)) * (N - 7);
  const zc = climb * DEPTH - 0.9, yc = climb * RISE + 1.55 + Math.sin(climb * Math.PI * 2) * 0.025;
  const cs = Math.cos(PITCH), sn = Math.sin(PITCH);
  // camera space (pitched up the stairs), clipped against a near plane so walls can run past the camera
  const NEAR = 0.05;
  const cam = (x, y, z) => { const dy = y - yc, dz = z - zc; return [x, dy * cs - dz * sn, dy * sn + dz * cs]; };
  const proj = ([x, Y, Z]) => [cx + (x * F) / Z, cy - (Y * F) / Z, Z];
  const P = (x, y, z) => { const c = cam(x, y, z); return c[2] < NEAR ? null : proj(c); };
  const cut = (a, b) => { const t = (NEAR - a[2]) / (b[2] - a[2]); return a.map((v, i) => v + (b[i] - v) * t); };
  function quad(pts, fill) {
    const c = pts.map((p) => cam(...p)), out = [];
    c.forEach((a, i) => { const b = c[(i + 1) % c.length]; if (a[2] >= NEAR) out.push(a); if ((a[2] >= NEAR) !== (b[2] >= NEAR)) out.push(cut(a, b)); });
    if (out.length < 3) return null;
    const q = out.map(proj);
    ctx.beginPath(); q.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    return q;
  }
  // adds a clipped 3D segment to the current path
  function seg(p1, p2) {
    let a = cam(...p1), b = cam(...p2);
    if (a[2] < NEAR && b[2] < NEAR) return false;
    if (a[2] < NEAR) a = cut(a, b); else if (b[2] < NEAR) b = cut(b, a);
    const A = proj(a), B = proj(b); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); return true;
  }
  const hx = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)), CB = hx(pal.b), CA = hx(pal.a);
  const colAt = (z, al = 1) => { const k = clamp(z / (N * DEPTH)); return `rgba(${CB.map((v, i) => Math.round(v + (CA[i] - v) * k)).join(',')},${al})`; }; // neon colour along the climb
  // a neon line split into short pieces so its colour follows colAt
  function neonLine(x, h0, width, glow) {
    for (let z = Math.max(0, Math.floor(zn)); z < N * DEPTH; z += 0.8) {
      const z2 = Math.min(N * DEPTH, z + 0.8); neon(colAt(z), width, glow); ctx.beginPath();
      if (seg([x, z * SLOPE + h0, z], [x, z2 * SLOPE + h0, z2])) ctx.stroke();
    }
  }
  const neon = (col, width, glow) => { ctx.strokeStyle = col; ctx.lineWidth = width; ctx.shadowColor = col; ctx.shadowBlur = glow; };
  const zT = N * DEPTH, yT = N * RISE, zn = zc - 0.6, pulse = 0.55 + 0.45 * kick;
  ctx.fillStyle = mix(pal.bg, '#000000', 0.15); ctx.fillRect(0, 0, w, h);
  const brick = mix(pal.bg, pal.fg, 0.09), mortar = rgba(mix(pal.bg, '#000000', 0.4), 0.8);

  // ceiling, with a skylight near the top showing the dusk sky
  // the whole ceiling carries the dusk gradient; the skylight is a brighter window in it
  const c0 = P(0, (zc + 0.4) * SLOPE + CEIL, zc + 0.4), c1 = P(0, yT + CEIL, zT);
  let ceil = mix(pal.bg, pal.b, 0.4);
  if (c0 && c1) { ceil = ctx.createLinearGradient(c0[0], c0[1], c1[0], c1[1]); ceil.addColorStop(0, mix(pal.bg, pal.b, 0.4)); ceil.addColorStop(1, mix(pal.bg, pal.a, 0.75)); }
  quad([[-HW, zn * SLOPE + CEIL, zn], [HW, zn * SLOPE + CEIL, zn], [HW, yT + CEIL, zT], [-HW, yT + CEIL, zT]], ceil);
  // glass light panels along the whole ceiling, glowing in the climb's gradient and pulsing with the kick
  const s0 = Math.max(0.2, zn), s1 = zT - 0.5;
  for (let z = Math.floor(s0 / 0.9) * 0.9; z < s1; z += 0.9) {
    const z2 = Math.min(s1, z + 0.75), yy = (q) => q * SLOPE + CEIL - 0.01;
    quad([[-0.5, yy(z), z], [0.5, yy(z), z], [0.5, yy(z2), z2], [-0.5, yy(z2), z2]], colAt(z, 0.55 + 0.35 * pulse));
  }
  ctx.strokeStyle = rgba(pal.bg, 0.6); ctx.lineWidth = 1.5; ctx.beginPath();
  seg([0, s0 * SLOPE + CEIL - 0.02, s0], [0, s1 * SLOPE + CEIL - 0.02, s1]); ctx.stroke();
  // far wall around the roof door
  quad([[-HW, yT, zT], [HW, yT, zT], [HW, yT + CEIL, zT], [-HW, yT + CEIL, zT]], brick);
  // the door at the top: dusk light
  const doorOpen = clamp((local - 0.82) / 0.18);
  const dq = quad([[-0.5, yT, zT], [0.5, yT, zT], [0.5, yT + 2.1, zT], [-0.5, yT + 2.1, zT]], rgba(pal.a, 0.9));
  if (dq && dq.length === 4) {
    const [x0, y0] = dq[3], [x1, y1] = dq[1];
    if (local < 0.8) S.hit(x0, y0, x1 - x0, y1 - y0, 0.72); // click the roof door: climb up and out
    const sky = ctx.createLinearGradient(0, y0, 0, y1);
    sky.addColorStop(0, mix(pal.bg, pal.b, 0.6)); sky.addColorStop(1, pal.a);
    ctx.fillStyle = sky; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.shadowColor = pal.b; ctx.shadowBlur = 40 * pulse; ctx.strokeStyle = pal.b; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0); ctx.shadowBlur = 0;
    ctx.fillStyle = mix(pal.bg, pal.fg, 0.12); ctx.fillRect(x0, y0, (x1 - x0) * (1 - doorOpen), y1 - y0);
  }
  // side walls: brick, washed by the neon above, plus the posters
  for (const side of [-1, 1]) {
    const X = side * HW;
    const q = quad([[X, zn * SLOPE - 0.3, zn], [X, yT, zT], [X, yT + CEIL, zT], [X, zn * SLOPE + CEIL, zn]], brick);
    if (!q) continue;
    ctx.save(); ctx.clip();
    const BH = 0.085, BL = 0.23, zFar = Math.min(zT, zc + 6);
    ctx.strokeStyle = mortar; ctx.lineWidth = 1; ctx.beginPath();
    for (let r = Math.floor(Math.max(zn * SLOPE - 0.4, yc - 3.5) / BH); r * BH < Math.min(yT + CEIL + 0.1, yc + 5); r++) { // visible rows only
      const yy = r * BH; seg([X, yy, zn], [X, yy, zT]);
      for (let zz = zn - ((zn % BL) + BL) + (r % 2) * BL / 2; zz < zFar; zz += BL) if (zz >= zn) seg([X, yy, zz], [X, yy + BH, zz]);
    }
    ctx.stroke();
    // coloured light from the ceiling strip, pulsing with the kick
    ctx.globalCompositeOperation = 'lighter';
    for (let lz = Math.max(0, Math.floor(zn)); lz < zT; lz += 1.3) {
      const L = P(X, lz * SLOPE + CEIL - 0.4, lz);
      if (!L) continue;
      const r = (1.5 * F) / L[2], g = ctx.createRadialGradient(L[0], L[1], 0, L[0], L[1], r);
      g.addColorStop(0, colAt(lz, 0.1 + 0.22 * pulse)); g.addColorStop(1, colAt(lz, 0));
      ctx.fillStyle = g; ctx.fillRect(L[0] - r, L[1] - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
    // posters (album / single covers), drawn with an affine fit to the wall
    // posters made per palette ({pal}) only exist for Sunset rave and Gold rush; other palettes show the rest
    const list = (window.POSTERS || []).filter((it) => !it.src.includes('{pal}') || palKey === 'sunset' || palKey === 'gold');
    SLOTS.forEach(([sd, pz], k) => {
      if (sd !== side || !list.length) return;
      const item = list[k % list.length], img = posterImg(item.src.replace('{pal}', palKey));
      if (!img.complete || !img.naturalWidth) return;
      const sz = 0.62, ph = sz * (img.naturalHeight / img.naturalWidth), py = pz * SLOPE + 1.5, za = side < 0 ? pz : pz + sz, zb = side < 0 ? pz + sz : pz;
      const tl = P(X, py + ph, za), tr = P(X, py + ph, zb), bl = P(X, py, za);
      // the flat image fit only holds at a distance: fade posters out as they come close, skip them once passed
      if (!tl || !tr || !bl || Math.min(tl[2], tr[2], bl[2]) < 1.1) return;
      ctx.save(); ctx.globalAlpha = clamp((Math.min(tl[2], tr[2], bl[2]) - 1.1) / 0.8);
      ctx.transform((tr[0] - tl[0]) / img.naturalWidth, (tr[1] - tl[1]) / img.naturalWidth, (bl[0] - tl[0]) / img.naturalHeight, (bl[1] - tl[1]) / img.naturalHeight, tl[0], tl[1]);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
      const fog = clamp((pz - zc) / 9), frame = quad([[X, py, za], [X, py, zb], [X, py + ph, zb], [X, py + ph, za]], rgba(pal.bg, fog * 0.6));
      if (frame) { ctx.strokeStyle = colAt(pz, 0.35 + 0.4 * kick); ctx.lineWidth = 1.5; ctx.stroke(); }
    });
    ctx.restore();
  }
  // neon strips along both ceiling edges and the handrail, pulsing with the music
  for (const side of [-1, 1]) neonLine(side * (HW - 0.02), CEIL - 0.02, 3 + 2 * kick, 14 + 22 * kick);
  neonLine(HW - 0.03, 0.9, 3 + 2 * kick, 12 + 18 * kick);
  ctx.shadowBlur = 0;
  // steps, far to near, with a neon strip on each nose (alternating colours)
  for (let i = N - 1; i >= 0; i--) {
    const z0 = i * DEPTH, y0 = i * RISE;
    if (z0 + DEPTH < zn) continue;
    const fog = clamp(1 - (z0 - zc) / 9);
    quad([[-HW, y0 + RISE, z0], [HW, y0 + RISE, z0], [HW, y0 + RISE, z0 + DEPTH], [-HW, y0 + RISE, z0 + DEPTH]], mix(pal.bg, pal.fg, 0.05 + 0.1 * fog));
    if (z0 > zn) quad([[-HW, y0, z0], [HW, y0, z0], [HW, y0 + RISE, z0], [-HW, y0 + RISE, z0]], mix(pal.bg, pal.fg, 0.02 + 0.04 * fog));
    ctx.strokeStyle = colAt(z0, (0.3 + 0.6 * fog) * pulse); ctx.lineWidth = Math.max(1, 3 * fog);
    ctx.beginPath(); if (seg([-HW, y0 + RISE, z0], [HW, y0 + RISE, z0])) ctx.stroke();
  }
  // the street door closing behind you (opening at the start of this stage)
  if (local < 0.12) {
    const o = ease(local / 0.12), half = w / 2;
    ctx.fillStyle = mix(pal.bg, '#000000', 0.4); ctx.fillRect(-o * half, 0, half, h); ctx.fillRect(half + o * half, 0, half, h);
  }
  // stepping out into the light (from here the page stops scrolling and the roof plays by itself)
  if (doorOpen > 0) { ctx.fillStyle = rgba(pal.fg, doorOpen * doorOpen * 0.9); ctx.fillRect(0, 0, w, h); }
}

// ---------- 3 · the roof ----------
function roof(ctx, S) {
  const { w, h, pal, local, kick, t, beat } = S, rise = (1 - ease(clamp(local * 1.5))) * h * 0.12;
  const horizon = h * 0.62 + rise;
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, pal.bg); sky.addColorStop(0.55, mix(pal.bg, pal.b, 0.55)); sky.addColorStop(1, pal.a);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
  // setting sun
  ctx.fillStyle = rgba(pal.fg, 0.85); ctx.shadowColor = pal.a; ctx.shadowBlur = 60;
  ctx.beginPath(); ctx.arc(w * 0.68, horizon - h * 0.02, Math.min(w, h) * 0.07, Math.PI, 0); ctx.fill(); ctx.shadowBlur = 0;
  // Amsterdam rooftops: gables and chimneys
  let x = -20; const u = h / 900;
  ctx.fillStyle = mix(pal.bg, '#000000', 0.25);
  for (const b of SKY) {
    const bw = 110 * u * b.w, bh = 120 * u * b.h, top = horizon - bh;
    ctx.beginPath(); ctx.moveTo(x, h);
    if (b.gable) { ctx.lineTo(x, top + 30 * u); ctx.lineTo(x + bw * 0.25, top + 30 * u); ctx.lineTo(x + bw * 0.25, top); ctx.lineTo(x + bw * 0.75, top); ctx.lineTo(x + bw * 0.75, top + 30 * u); ctx.lineTo(x + bw, top + 30 * u); }
    else { ctx.lineTo(x, top); ctx.lineTo(x + bw, top); }
    ctx.lineTo(x + bw, h); ctx.fill();
    if (b.chim) ctx.fillRect(x + bw * 0.6, top - 26 * u, 12 * u, 26 * u);
    b.lit.forEach((on, k) => { if (on) { ctx.fillStyle = rgba(pal.a, 0.6); ctx.fillRect(x + bw * (0.2 + (k % 3) * 0.25), top + 45 * u + Math.floor(k / 3) * 34 * u, 9 * u, 14 * u); ctx.fillStyle = mix(pal.bg, '#000000', 0.25); } });
    x += bw - 2; if (x > w) break;
  }
  // the roof deck
  ctx.fillStyle = mix(pal.bg, '#000000', 0.5); ctx.fillRect(0, horizon + 40 * u, w, h);
  ctx.fillStyle = rgba(pal.fg, 0.08); ctx.fillRect(0, horizon + 40 * u, w, 3 * u);
  // DJ table (the wooden plank from the photos) with decks
  const tw = Math.min(w * 0.5, 460 * u), tx = w / 2 - tw / 2, ty = horizon + 10 * u;
  ctx.fillStyle = mix(pal.a, '#000000', 0.55); ctx.fillRect(tx, ty, tw, 16 * u);
  ctx.fillStyle = mix(pal.bg, '#000000', 0.3); ctx.fillRect(tx + tw * 0.15, ty - 22 * u, tw * 0.7, 22 * u);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 3 ? rgba(pal.b, 0.4 + 0.6 * kick) : rgba(pal.a, 0.8); ctx.fillRect(tx + tw * (0.3 + i * 0.035), ty - 14 * u, 5 * u, 4 * u); }
  // festoon lights, bulbs pulsing with the kick
  for (const [y0, sag] of [[h * 0.14, h * 0.1], [h * 0.26, h * 0.08]]) {
    ctx.strokeStyle = rgba(pal.bg, 0.9); ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i <= 40; i++) { const u2 = i / 40, yy = y0 + rise + Math.sin(u2 * Math.PI) * sag; i ? ctx.lineTo(u2 * w, yy) : ctx.moveTo(0, yy); }
    ctx.stroke();
    for (let i = 1; i < 14; i++) {
      const u2 = i / 14, yy = y0 + rise + Math.sin(u2 * Math.PI) * sag + 8;
      ctx.fillStyle = rgba(pal.a, 0.75 + 0.25 * kick); ctx.shadowColor = pal.a; ctx.shadowBlur = 14 + 16 * kick;
      ctx.beginPath(); ctx.arc(u2 * w, yy, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
  // smoke drifting up from the booth
  for (const s of SMOKE) {
    const life = ((t * 0.08 + s.ph) % 1), sx = w / 2 + (s.x - 0.5) * tw * 1.4 + Math.sin(t * 0.5 + s.ph) * 30, sy = ty - life * h * 0.35;
    const r = (60 + life * 160) * u * s.s, g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    g.addColorStop(0, rgba(pal.fg, 0.12 * (1 - life))); g.addColorStop(1, rgba(pal.fg, 0));
    ctx.fillStyle = g; ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
  }
  // white-out from the stairwell door fading away
  if (local < 0.25) { ctx.fillStyle = rgba(pal.fg, 0.9 * (1 - local / 0.25) ** 2); ctx.fillRect(0, 0, w, h); }
}

window.addEventListener('DOMContentLoaded', () => Entrance.start({ draw: (ctx, S) => (S.stage === 0 ? outside : S.stage === 1 ? stairs : roof)(ctx, S) }));
</script>
