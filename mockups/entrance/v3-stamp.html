<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On the List · Epping entrance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="wordmark.js"></script>
<script src="shared.js"></script>
<script>
// Concept 3 · On the List: your ticket gets scanned at the door, the EPPING stamp slams onto your hand,
// then the camera dives into the G's counter: the hole in the letter is the doorway to the floor.
const { clamp, lerp, ease, rgba, mix, drawLogo, rand, G_COUNTER, VB, PATH } = Entrance.util;
const R = rand(5), BARS = Array.from({ length: 46 }, () => 1 + Math.floor(R() * 4)), INK = Array.from({ length: 40 }, () => [R() - 0.5, R() - 0.5, R()]);
const font = (px, wt = 800, fam = 'Unbounded') => `${wt} ${px}px ${fam}, system-ui, sans-serif`;

function floorScene(ctx, S, cx, cy, R0) {
  const { pal, kick, beat } = S;
  ctx.fillStyle = pal.b; ctx.fillRect(cx - R0, cy - R0, R0 * 2, R0 * 2);
  for (let i = 12; i >= 0; i--) {
    const r = R0 * (((i + (beat % 1)) / 12) ** 1.6);
    ctx.fillStyle = i % 2 ? pal.a : pal.b; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = rgba(pal.fg, 0.35 + 0.4 * kick); ctx.beginPath(); ctx.arc(cx, cy, R0 * 0.06, 0, Math.PI * 2); ctx.fill();
}

function ticket(ctx, S) {
  const { w, h, pal, local, kick, t } = S, cx = w / 2, cy = h / 2;
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, w, h);
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.6);
  glow.addColorStop(0, rgba(pal.b, 0.18 + 0.08 * kick)); glow.addColorStop(1, rgba(pal.b, 0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
  const tw = Math.min(w * 0.86, 520), th = tw * 0.5, x = cx - tw / 2, y = cy - th / 2 + Math.sin(t * 1.3) * 4;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(lerp(-0.08, 0, ease(local))); ctx.translate(-cx, -cy);
  ctx.fillStyle = pal.fg; ctx.beginPath(); ctx.roundRect(x, y, tw, th, 14); ctx.fill();
  // perforation
  ctx.fillStyle = pal.bg;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(x + tw * 0.72, y + 10 + i * (th - 20) / 8, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = pal.bg; ctx.font = font(tw * 0.03, 600, 'Space Grotesk'); ctx.textBaseline = 'alphabetic';
  ctx.fillText('EPPING PRESENTS · VOL. 03', x + tw * 0.06, y + th * 0.2);
  drawLogo(ctx, pal, x + tw * 0.36, y + th * 0.46, tw * 0.58, { color: pal.bg, split: 0 });
  ctx.fillText('SAT 14.11 · 22:00 – 05:00 · AMSTERDAM', x + tw * 0.06, y + th * 0.78);
  ctx.fillText('GUEST LIST · +1', x + tw * 0.06, y + th * 0.88);
  // barcode on the stub
  let bx = x + tw * 0.77;
  for (const b of BARS) { if (bx > x + tw * 0.95) break; ctx.fillRect(bx, y + th * 0.18, b * 1.6, th * 0.64); bx += b * 1.6 + 2; }
  // scanner laser sweeping the stub
  const sweep = y + th * (0.14 + 0.72 * ((local * 3) % 1));
  if (local < 0.75) {
    ctx.shadowColor = pal.a; ctx.shadowBlur = 18; ctx.fillStyle = pal.a;
    ctx.fillRect(x + tw * 0.74, sweep, tw * 0.24, 3); ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = pal.b; ctx.font = font(tw * 0.05);
    ctx.save(); ctx.translate(x + tw * 0.86, y + th / 2); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.fillText('ON THE LIST', 0, tw * 0.02); ctx.restore();
  }
  ctx.restore();
}

function stampAndDive(ctx, S) {
  const { w, h, pal, stage, local, kick } = S, cx = w / 2, cy = h / 2;
  const baseW = Math.min(w * 0.82, 900), s0 = baseW / (VB[2] - 12);
  // 0..0.25: stamp slams down (scale from 2.4 to 1); 0.25..1 (and the floor stage): dive into the G counter
  const slam = stage === 1 ? clamp(local / 0.22) : 1;
  const dive = stage === 1 ? clamp((local - 0.3) / 0.7) : 1 + local * 0.6;
  ctx.fillStyle = mix(pal.bg, pal.fg, 0.04); ctx.fillRect(0, 0, w, h);
  const zoom = slam < 1 ? lerp(2.4, 1, ease(slam)) : Math.exp(ease(clamp(dive)) * 4.4 + Math.max(0, dive - 1) * 3);
  const shake = stage === 1 && local > 0.22 && local < 0.3 ? (1 - (local - 0.22) / 0.08) * 10 * (Math.random() - 0.5) : 0; // impact
  const s = s0 * zoom;
  // the point that stays fixed on screen drifts from the logo centre to the G's counter
  const mx = VB[0] + VB[2] / 2, my = VB[1] + VB[3] / 2, f = ease(clamp(dive * 1.4));
  const fx = lerp(mx, G_COUNTER.x, f), fy = lerp(my, G_COUNTER.y, f);
  const T = (x, y) => [cx + (x - fx) * s + shake, cy + (y - fy) * s];
  // ink splatter after the impact
  if (slam === 1) {
    for (const [dx, dy, r] of INK) {
      const [px, py] = T(mx + dx * 260, my + dy * 140);
      ctx.fillStyle = rgba(r > 0.5 ? pal.b : pal.a, 0.5); ctx.beginPath(); ctx.arc(px, py, (2 + r * 6) * zoom, 0, Math.PI * 2); ctx.fill();
    }
  }
  // the floor, seen through the counter
  const [gx, gy] = T(G_COUNTER.x, G_COUNTER.y);
  ctx.save(); ctx.beginPath(); ctx.ellipse(gx, gy, G_COUNTER.rx * s, G_COUNTER.ry * s, 0, 0, Math.PI * 2); ctx.clip();
  floorScene(ctx, S, gx, gy, Math.max(G_COUNTER.rx * s, 10) * 1.1);
  ctx.restore();
  // the stamped wordmark
  ctx.save(); const [ox, oy] = T(0, 0); ctx.translate(ox, oy); ctx.scale(s, s);
  ctx.globalAlpha = slam < 1 ? lerp(0.2, 1, slam) : 1;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = pal.a; ctx.translate(-2.4, 0); ctx.fill(PATH); ctx.fillStyle = pal.b; ctx.translate(4.8, 0); ctx.fill(PATH); ctx.translate(-2.4, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = pal.fg; ctx.fill(PATH);
  ctx.restore();
  if (stage === 2) { // through the hole: the floor fills the screen
    ctx.globalAlpha = clamp(local * 3); floorScene(ctx, S, cx, cy, Math.hypot(w, h)); ctx.globalAlpha = 1;
  }
  if (stage === 1 && local < 0.3 && slam === 1) {
    ctx.fillStyle = pal.fg; ctx.font = font(13, 600, 'Space Grotesk'); ctx.textAlign = 'center';
    ctx.globalAlpha = 1 - (local - 0.22) / 0.08; ctx.fillText('STAMPED · WELCOME IN', cx, cy + baseW * 0.22); ctx.globalAlpha = 1; ctx.textAlign = 'start';
  }
}

Entrance.start({ draw: (ctx, S) => (S.stage === 0 ? ticket : stampAndDive)(ctx, S) });
</script>
</body>
</html>
